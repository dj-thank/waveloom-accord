<!doctype html>
<html lang="ja" data-review-ready="false">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kagariai Roof Rib — map review only</title>
    <script type="importmap">
      { "imports": { "three": "../../../node_modules/three/build/three.module.js", "three/addons/": "../../../node_modules/three/examples/jsm/" } }
    </script>
    <style>
      :root { color-scheme: dark; font-family: Inter, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body, #stage { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101817; }
      canvas { display: block; width: 100%; height: 100%; }
      #review-badge { position: fixed; z-index: 5; top: 14px; left: 14px; max-width: 520px; padding: 11px 14px; border: 1px solid #e0a45e; border-left-width: 5px; background: rgba(20, 27, 25, .94); color: #f3dfc4; font: 700 13px/1.45 ui-monospace, Consolas, monospace; }
      #review-badge small { display: block; color: #b9c8c0; font-weight: 400; }
      #toolbar { position: fixed; z-index: 5; top: 14px; right: 14px; display: grid; gap: 7px; justify-items: end; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: end; }
      button { padding: 7px 10px; border: 1px solid #587065; border-radius: 4px; background: rgba(26, 48, 40, .94); color: #edf4ef; cursor: pointer; }
      button[aria-pressed="true"] { border-color: #e0a45e; background: #59462f; }
      #telemetry { position: fixed; z-index: 5; right: 14px; bottom: 14px; min-width: 280px; padding: 10px 12px; border: 1px solid #60776d; background: rgba(10, 16, 14, .9); color: #c9d7cf; font: 12px/1.55 ui-monospace, Consolas, monospace; }
      body.capture #toolbar { display: none; }
      @media (max-width: 760px) { #review-badge { max-width: calc(100% - 28px); } #toolbar { top: 112px; } }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="review-badge">
      CANDIDATE MAP REVIEW — NOT RUNTIME ADMITTED
      <small>collision:none · reviewOnly:true · production enabled:false</small>
    </div>
    <div id="toolbar">
      <div class="row">
        <button data-site="overview">Overview</button>
        <button data-site="west">West</button>
        <button data-site="mid">Mid</button>
        <button data-site="east">East</button>
      </div>
      <div class="row">
        <button data-distance="12">12 m</button>
        <button data-distance="28">28 m</button>
        <button data-distance="45">45 m</button>
      </div>
      <div class="row">
        <button data-light="day">Day</button>
        <button data-light="dusk">Dusk</button>
        <button data-light="backlit">Backlit</button>
      </div>
    </div>
    <div id="telemetry">Loading review-only scene…</div>
    <script type="module" src="./map-review.js?v=20260803-01"></script>
  </body>
</html>
