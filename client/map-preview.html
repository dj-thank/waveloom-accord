<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>篝合 — 大潮井マップレビュー</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Noto Sans JP", system-ui, sans-serif;
      background: #071417;
      color: #f5efe0;
    }
    * { box-sizing: border-box; }
    html, body, canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    canvas { display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .hud {
      position: fixed;
      inset: 18px auto auto 18px;
      width: min(420px, calc(100vw - 36px));
      padding: 15px 16px 14px;
      border: 1px solid rgba(118, 230, 223, .28);
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(7, 20, 23, .91), rgba(18, 42, 45, .72));
      box-shadow: 0 18px 60px rgba(0, 0, 0, .34), inset 0 1px rgba(255,255,255,.05);
      backdrop-filter: blur(14px);
      pointer-events: none;
    }
    .eyebrow {
      color: #76e6df;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    h1 { margin: 5px 0 3px; font-size: clamp(21px, 3vw, 31px); letter-spacing: .03em; }
    p { margin: 0; color: #c7d5d1; font-size: 12px; line-height: 1.55; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
      pointer-events: auto;
    }
    button {
      appearance: none;
      border: 1px solid rgba(216, 204, 178, .24);
      border-radius: 999px;
      padding: 7px 11px;
      color: #f5efe0;
      background: rgba(216, 204, 178, .08);
      font: inherit;
      font-size: 11px;
      font-weight: 750;
      cursor: pointer;
    }
    button:hover, button[aria-pressed="true"] {
      color: #071417;
      background: #76e6df;
      border-color: #76e6df;
    }
    .metric {
      position: fixed;
      right: 18px;
      bottom: 18px;
      display: grid;
      grid-template-columns: repeat(3, auto);
      gap: 8px;
      padding: 9px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      background: rgba(7,20,23,.76);
      backdrop-filter: blur(10px);
      font-size: 10px;
      color: #d8ccb2;
      pointer-events: none;
    }
    .metric b { color: white; font-size: 12px; }
    .status {
      position: fixed;
      inset: auto auto 18px 18px;
      color: #76e6df;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      pointer-events: none;
    }
    @media (max-width: 640px) {
      .hud { inset: 10px 10px auto; width: auto; }
      .metric { right: 10px; bottom: 10px; }
      .status { left: 10px; bottom: 62px; }
    }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <section class="hud" aria-label="マップ情報">
    <div class="eyebrow">Original Kagariai Map / Review Build</div>
    <h1>潮鏡 — 貝灰灯港</h1>
    <p>大潮井の競技用コライダー、Botの3経路、外周の港湾街、藍染帆、潮位トラスを同じマップ定義から確認できます。ドラッグで旋回、ホイールで距離調整。</p>
    <div class="actions">
      <button type="button" data-view="orbit" aria-pressed="true">自動周回</button>
      <button type="button" data-view="spawn">東スポーン</button>
      <button type="button" data-view="objective">制圧点</button>
      <button type="button" data-view="cloister">北回廊</button>
      <button type="button" data-view="shallows">南船渠</button>
      <button type="button" data-view="aerial">俯瞰</button>
      <button type="button" data-view="network">5拠点全景</button>
      <button type="button" data-view="site-shiogama">塩窯</button>
      <button type="button" data-view="site-mizuichi">浮標市場</button>
      <button type="button" data-view="site-kado">乾ドック</button>
      <button type="button" data-view="site-ami">網橋運河</button>
      <button type="button" data-view="site-kazami">造船所</button>
    </div>
  </section>
  <div class="status" id="status">building original presentation…</div>
  <div class="metric" aria-label="描画統計">
    <span>CALLS<br><b id="calls">—</b></span>
    <span>TRIS<br><b id="tris">—</b></span>
    <span>INSTANCES<br><b id="instances">—</b></span>
  </div>
  <script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/addons/"}}</script>
  <script type="module" src="/client/map-preview.js"></script>
</body>
</html>
